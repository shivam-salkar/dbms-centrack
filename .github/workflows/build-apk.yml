name: "Build Android APK (ARM64-v8a)"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: "Build ARM64-v8a APK"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Make Gradle Wrapper executable
        run: |
          chmod +x android/gradlew

      - name: Verify Flutter & Environment
        run: |
          flutter --version
          flutter doctor -v

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Analyze project code
        run: |
          flutter analyze

      - name: Run unit and widget tests
        run: |
          flutter test

      - name: Build APK for ARM64-v8a only
        run: |
          flutter build apk --release --target-platform android-arm64

      - name: Prepare APK artifact
        run: |
          mkdir -p output
          find build/app/outputs/flutter-apk/ -name "*.apk" -exec cp {} output/janganatest-arm64-v8a-release.apk \;
          ls -la output/

      - name: Upload ARM64-v8a APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: janganatest-arm64-v8a-release-apk
          path: output/janganatest-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v2.4.1 >/dev/null 2>&1; then
            gh release upload v2.4.1 output/janganatest-arm64-v8a-release.apk --clobber
          else
            gh release create v2.4.1 output/janganatest-arm64-v8a-release.apk \
              --title "Jangana Census Tracker v2.4.1 (ARM64-v8a)" \
              --notes "### Jangana Census Tracker v2.4.1 (ARM64-v8a Release)
          * **Target Architecture**: Android ARM64-v8a only
          * **Internet Connectivity**: Added Android internet permissions in \`AndroidManifest.xml\` for live Supabase Auth and database operations.
          * **Supabase Integration**: Connected to live Supabase project with 15,000 synthetic Mumbai records.
          * **Demo Accounts**:
            * **Admin**: \`admin.demo@janganatest.local\` / \`JanganaDemo@2026\`
            * **Enumerator 1**: \`enumerator1.demo@janganatest.local\` / \`JanganaEnum@2026\`
            * **Enumerator 2**: \`enumerator2.demo@janganatest.local\` / \`JanganaEnum2@2026\`"
          fi

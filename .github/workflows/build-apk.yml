name: Build Android APK (ARM64-v8a)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ARM64-v8a APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter Doctor
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Linter & Static Analysis
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Release APK (Target: arm64-v8a only)
        run: |
          flutter build apk --release --target-platform android-arm64

      - name: Verify & Prepare APK Artifact
        run: |
          mkdir -p dist
          find build/app/outputs/flutter-apk/ -name "*.apk" -exec cp {} dist/janganatest-arm64-v8a-release.apk \;
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: janganatest-arm64-v8a-release-apk
          path: dist/janganatest-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
